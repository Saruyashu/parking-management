version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: parking-postgres
    environment:
      POSTGRES_DB: parking_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parking-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parking-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/parking_management?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key
      JWT_REFRESH_SECRET: dev-refresh-secret
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: sh -c "npx prisma migrate deploy && npm run dev"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: parking-web
    ports:
      - '3001:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: